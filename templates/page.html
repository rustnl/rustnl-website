{% extends "base.html" %}

{% block content %}
    {% for path in entry.extra.featured | default(value=[]) %}
      {% set featured_page = get_page(path=path) %}
      <article id="{{ featured_page.slug }}">
        {{ featured_page.summary | safe }}
        <p><a class="button" href="{{ featured_page.path }}">Read more</a></p>
      </article>
      <hr>
    {% endfor %}
    {{ entry.content | safe }}
    <hr>
{% endblock content %}
